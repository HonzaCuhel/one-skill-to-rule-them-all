name: Release bundle
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate and build canonical bundle
        run: |
          mkdir dist
          python scripts/package_skill.py install --destination "$PWD/dist/task-observer"
          python scripts/validate-skill-bundle.py "$PWD/dist/task-observer"
          python scripts/package_skill.py build --output "$PWD/dist/task-observer.skill"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/task-observer.skill --repo "$GITHUB_REPOSITORY"
