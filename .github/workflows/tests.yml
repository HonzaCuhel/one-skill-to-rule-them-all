name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate the exact installed bundle and build artifact
        run: |
          python -c "from pathlib import Path; Path('dist').mkdir()"
          python scripts/package_skill.py install --destination dist/task-observer
          python scripts/validate-skill-bundle.py dist/task-observer
          python scripts/package_skill.py verify-install --destination dist/task-observer
          python scripts/package_skill.py build --output dist/task-observer.skill
      - uses: actions/upload-artifact@v4
        with:
          name: task-observer-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/task-observer.skill
